# Task 5 (ADR-026 (fork)): coding/new-task-v1 plus the bounded adversarial
# fix loop. Like coding/new-task-verified-v1 (Task 4 — ADR-025 (fork)), an
# independent probe writer and code reviewer run between the coder and the
# build/PR gates — but here, a NOT-READY verdict sends the work back to a
# fixer call instead of just being reported. Each round reruns the full
# sequence (fresh probes -> the probe run -> a fresh code review), bounded by
# max_iterations; a loop that's still NOT_READY when the cap is reached is
# "unresolved" per on_unresolved (default pr_with_warning: ship the PR with
# the review:unresolved label rather than failing the task).
# coding/new-task-v1 and coding/new-task-verified-v1 are both unchanged by
# this workflow's existence.
id: coding/new-task-adversarial-v1
version: 1.0.0
domain: coding
description: Implement a GitHub issue or free-text task, run it through a bounded adversarial review/fix loop, and open a pull request.
requires_repo: true
read_only: false
prompt:
  # Same coder prompt as coding/new-task-v1 — the review/fixer calls run
  # their own, separate prompts (agent/src/review/prompts.py), not this one.
  template: registry://prompt/coding-new-task-workflow
  placeholders:
    - repo_url
    - task_id
    - workspace
    - branch_name
    - default_branch
    - max_turns
    - setup_notes
    - memory_context
hydration:
  sources: [issue, memory, task_description]
agent_config:
  tier: standard
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, WebFetch]
  cedar_policy_modules: [builtin/hard_deny, builtin/soft_deny]
repo_config:
  provider: github
  discover: true
required_inputs:
  one_of: [issue_number, task_description]
steps:
  - { kind: clone_repo,      name: setup }
  - { kind: hydrate_context, name: context }
  - { kind: run_agent,       name: implement }
  - kind: review_and_fix
    name: review
    review_mode: adversarial
    max_iterations: 2
    block_on_severity: major
    on_unresolved: pr_with_warning
  - { kind: verify_build,    name: build, gate: regression_only }
  - { kind: ensure_pr,       name: open_pr, strategy: create }
terminal_outcomes:
  primary: pr_url
convergence:
  mode: test_gated
  required_sensors: [verify_build]
  terminal_outcomes: [pr_opened]
limits:
  max_turns: 100
promotion_gate:
  requires: [tests:agent/review_and_fix]
status: production
